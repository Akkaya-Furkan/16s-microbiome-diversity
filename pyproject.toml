[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microdiv-p26"
version = "0.1.0"
description = "Reproducible body-site diversity analysis of public 16S ASV counts"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3", "matplotlib==3.10.3", "h5py==3.13.0"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
microdiv = "microdiv.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
